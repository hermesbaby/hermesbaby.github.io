name: Check Documentation

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv package manager
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install HermesBaby
        run: |
          uv tool install --from git+https://github.com/hermesbaby/hermesbaby.git@main hermesbaby
          uv tool update-shell
          hermesbaby --version
      - name: Install HermesBaby toolbox
        run: |
          source .github/workflows/mock_hb_tools_install.sh
      - name: Build static site
        run: |
          hb html

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19.1.0
        with:
          globs: |
            docs/**/*.md
            README.md
